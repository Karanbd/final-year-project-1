<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial 
scale=1.0" />
  <title>Music Recommendation System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #fff;
      padding: 2rem;
    }
    .container {
      max-width :
        1200px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom :
        3rem;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background
        : #1a1a1a;
      padding: 1.5rem;
      border-radius: 12px;
      text-align: center;
    }
    .stat-number {
      font-size: 2rem;
      font-weight: bold;
      color: #1db954;
      margin-bottom: 0.5rem;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 2rem;
      margin-bottom: 2rem;
    }
    .card 
      {
      background: #1a1a1a;
      padding: 2rem;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .card:hover {
      background: #2a2a2a;
      transform: translateY(-5px);
    }
    .card 
      h3 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: #1db954;
    }
    .card-select {
      display
        : block;
      margin: 1rem 
        auto;
      padding: 0.5rem 1rem;
      
      background: #333;
      border: 1px solid #555;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
    }
    .card-btn {
      background: #1db954;
      color: #000;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .card-btn:hover {
      background: #1edf64;
      transform: scale(1.05);
    }
    .results {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 2rem;
      display: none;
    }
    .results.show {
      display: block;
    }
    .track-list {
      margin-top: 1rem;
    }
    .track-item {
     
      display: flex;
      
      align-items: center;
      padding: 1rem;
      border-bottom: 1px solid #333;
      transition: background 0.3s ease;
    }
    .track-item:hover {
      background: #2a2a2a;
    }
    .track-rank {
      font-weight: bold;
      width: 30px;
      color: #1db954;
    }
    .track-info {
      flex: 1;
      padding-left: 1rem;
    }
    .track-title {
      font-size: 1.1rem;
      margin-bottom: 0.25rem;
    }
    .track-meta {
      color: #b3b3b3;
      font-size: 0.9rem;
    }
    .track-score {
      color: #1db954;
      font-weight: bold;
      min-width: 80px;
    }
    .loading {
      text-align: center;
      padding: 2rem;
     
      color: #b3b3b3;
    }
    .error {
      color: #ff4444;
      text-align: center;
      padding: 1rem;
      background: #2a0a0a;
      border-radius: 8px;
      margin: 1rem 0;
    }
    @media (max-width: 768px) {
      .cards-grid {
        grid-template-columns: 1fr;
      
      }
      .stats-grid {
        grid-template-columns: 1fr;
 
      }
    }
  </style>
</head>
<body>
  <div
    class="container">
    <div class="header">
      <h1><i class="fab fa-spotify"></ 
        i> Music RecSys</h1>
      <p>Hybrid Neural Recommendations</p>
    </div>

    <div class="stats-grid" id="stats-grid">
      <div class="stat-card">
        <div class="stat-number" id="num-users">-</div>
        <div>Users</div>
      </div>
 
    <div class="stat-card">
      <div class="stat-number" id="num-songs">-</div>
 
        <div>Songs</div>
      </div>
      <div class="stat-card">

        <div class="stat-number" id="num-interactions">-</div>

        <div>Interactions</div>
      </div>

      <div class="stat-card">
        <div class="stat-number" id="num-models">-</div>
 
        <div>Models</div>
      </ 
        div>
    </div 
      >

    <div class="cards-grid">
      <div 
        class="card 
          " onclick="showRecs()">
        <h3><i class="fas fa-brain"></i> Hybrid Recs</h3>
        <p>Neural CF + Content Audio Embeddings</p>
 
        <select id="user-select">
 
          <option value="0">User 0</option>
 
          <option 
            value="1">User 1</option>
 
          <option value="2">User 2</option>
 
          <!-- Dynamic users loaded -->
        </select>
        <button 
          class="card-btn" id="get-recs-btn">
          < 
            i class="fas fa-magic"></ 
            i> Get Recs
        </button>
      </div 
        >

      <div class="card" onclick="showContent()">
 
        <h3><i class="fas fa-search"></i> Content Search</h3>
 
        <p>AST Audio Embedding Similarity</p>
        <input 
          type="text" id="song-search" placeholder="Song name..." style="width: 100%; padding: 0.5rem; margin: 1rem 0; background: #333; border: 1px solid #555; color: #fff; border-radius: 6px;">
 
        <button class="card-btn">
          < 
            i class="fas fa-search"></ 
            i> Search
        </button>
 
      </div>

      <div 
        class="card" onclick="showStats()">
        <h3><i class="fas fa-chart-bar"></i> Stats</h3>
 
        <p>Training Metrics & Evaluation</p>
        <button class="card-btn">
          < 
            i class="fas fa-chart-line"></ 
            i> View Metrics
        </button>
      </div 
        >
    </div>

    <div id="results" class="results">
 
      <h2>Recommendations</h2>
 
      <div id="track-list" class="track-list"></div>
    </div>

    <div id="error" class="error" style="display: none;"></div>
 
    <div id="loading" class="loading" style="display: none;">Loading...</div>
  </div>

  <script>
    const HYBRID_API = "http://localhost:5001";
 
    const CONTENT_API = "http://localhost:5000";
    
 
    let stats = {};
 
    let currentRecs = [];
    
 
    async function loadStats() {
 
      try {
 
        const res = await fetch(`${HYBRID_API}/stats`);
 
        stats 
          = await res.json();
 
        document.getElementById("num-users").textContent = stats.num_users;
 
        document.getElementById("num-songs").textContent = stats.num_songs;
 
        document.getElementById("num-interactions").textContent = stats.num_interactions;
 
        document.getElementById("num-models").textContent = stats.available_models.length;
        
 
        // Populate user selector
 
        const select = document.getElementById("user-select");
 
        select.innerHTML = '';
 
        for
          (let i = 0; i < Math.min(50, stats.num_users); i++) {
 
          select.innerHTML += `<option value="${i}">User ${i}</option>`;
 
        }
 
      } catch (e) {
 
        console.error('Stats load failed', e);
 
      }
 
    }
    
 
    async function 
      getHybridRecs() {
 
      const userId = parseInt(document.getElementById("user-select").value);
 
      document.getElementById("loading").style.display 
        = 'block';
 
      document.getElementById("error").style.display 
        
        = 'none';
 
      document.getElementById("results").classList.remove('show');
 
      try {
 
        const res = await fetch(`${HYBRID_API}/api/hybrid-recommend`, {

          method: 'POST',

          headers: {'Content-Type': 'application/json'},

          body 
            : JSON.stringify({user_id: userId, k
              : 20})

        });
 
        const data = await res.json();
 
        currentRecs = data.recommendations;
 
        displayRecs(data);
 
      } catch (e) {
 
        document.getElementById("error").innerText 
          = 'Failed to load recommendations';
 
        document.getElementById("error").style.display = 'block';
 
      } finally {
 
        document.getElementById("loading").style.display = 'none';
 
      }
 
    }
    
 
    function displayRecs(data) {
 
      document.getElementById("results").classList.add('show');
 
      const trackList = document.getElementById("track-list");
 
      trackList.innerHTML = '';
 
      data.recommendations.forEach((rec, idx) => {
 
        const div = document.createElement('div');
 
        div.className = 'track-item';
 
        div.innerHTML = `
 
          <span 
            class="track-rank">${idx+1}</span>
 
          <div 
            class="track-info">
 
            <h4>Song #${rec.song_id}</h4>
 
            <p>${(rec.score * 100).toFixed(1)}% confidence</p>
 
          </div>
 
          <span class="track-score">${(rec.score * 100).toFixed(1)}%</span>
 
        `;
 
        trackList.appendChild(div);
 
      });
 
    }
    
 
    document.getElementById("get-recs-btn").onclick = getHybridRecs;
    
 
    window.onload = loadStats;
  </script>
</body>
</html>
